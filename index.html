<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ritika Sharma — Senior Flutter Developer Portfolio | Mobile Application Development">
  <meta name="keywords" content="Flutter Developer, Mobile App Developer, iOS Android, Dart, Firebase, Clean Architecture">
  <meta name="author" content="Ritika Sharma">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph -->
  <meta property="og:title" content="Ritika Sharma — Senior Flutter Developer">
  <meta property="og:description" content="Senior Flutter Developer with 5+ years Flutter experience and 6+ years across SDLC.">
  <meta property="og:type" content="website">

  <title>Ritika Sharma | Senior Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      margin: 0;
      background-color: #060912;
      color: #F1F5F9;
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060912;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader-logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #00D9FF, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-bar {
      width: 200px;
      height: 2px;
      background: #111827;
      border-radius: 1px;
      margin-top: 24px;
      overflow: hidden;
    }
    .loader-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00D9FF, #7C3AED);
      border-radius: 1px;
      animation: load 2s ease-in-out forwards;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes load {
      from { width: 0%; }
      to { width: 100%; }
    }
    .loader-text {
      margin-top: 16px;
      font-size: 13px;
      color: #475569;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-logo">RS</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div class="loader-text">Loading portfolio...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('loading');
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 600);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
